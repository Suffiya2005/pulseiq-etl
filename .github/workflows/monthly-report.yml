
name: PulseIQ Monthly PDF Report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 1 * *"

permissions:
  contents: read

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate monthly PDF
        env:
          WAREHOUSE_HOST: ${{ secrets.WAREHOUSE_HOST }}
          WAREHOUSE_PORT: ${{ secrets.WAREHOUSE_PORT }}
          WAREHOUSE_DB: ${{ secrets.WAREHOUSE_DB }}
          WAREHOUSE_USER: ${{ secrets.WAREHOUSE_USER }}
          WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}
        run: |
          REPORT_MONTH=$(date -u -d "last month" +%Y-%m)
          python build_report.py --month "$REPORT_MONTH"

      - name: Upload PDF report
        uses: actions/upload-artifact@v4
        with:
          name: pulseiq-monthly-report
          path: reports/*.pdf
          if-no-files-found: error
          retention-days: 90
