catalog: pulseiq_warehouse
schema: warehouse
sql: "WITH employee_tenure AS (\r\n    SELECT\r\n        CASE\r\n            WHEN\
  \ CURRENT_DATE - valid_from::date < 365\r\n                THEN '0-1 years'\r\n\
  \            WHEN CURRENT_DATE - valid_from::date < 1095\r\n                THEN\
  \ '1-3 years'\r\n            WHEN CURRENT_DATE - valid_from::date < 1825\r\n   \
  \             THEN '3-5 years'\r\n            ELSE '5+ years'\r\n        END AS\
  \ tenure_band,\r\n        employee_id\r\n    FROM warehouse.dim_employee\r\n   \
  \ WHERE is_current = TRUE\r\n)\r\nSELECT\r\n    tenure_band,\r\n    COUNT(DISTINCT\
  \ employee_id) AS employee_count\r\nFROM employee_tenure\r\nGROUP BY tenure_band\r\
  \nORDER BY\r\n    CASE tenure_band\r\n        WHEN '0-1 years' THEN 1\r\n      \
  \  WHEN '1-3 years' THEN 2\r\n        WHEN '3-5 years' THEN 3\r\n        ELSE 4\r\
  \n    END;"
